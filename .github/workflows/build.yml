name: Materialize standalone RU library

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build dependency
        run: npm install --no-audit --no-fund

      - name: Fetch Laaru one final time
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          URL=$(node -p "require('./tools/laaru-source.json').download")
          EXPECTED_VERSION=$(node -p "require('./tools/laaru-source.json').version")
          curl -fL --retry 3 --retry-delay 5 "$URL" -o vendor/laaru.zip
          unzip -oq vendor/laaru.zip -d vendor
          test -f vendor/laaru-dnd5-hw/module.json
          test "$(node -p "require('./vendor/laaru-dnd5-hw/module.json').id")" = "laaru-dnd5-hw"
          test "$(node -p "require('./vendor/laaru-dnd5-hw/module.json').version")" = "$EXPECTED_VERSION"

      - name: Build LipatoS standalone module
        env:
          LAARU_SOURCE_ROOT: ${{ github.workspace }}/vendor/laaru-dnd5-hw
        run: npm run build

      - name: Replace repository with ready module
        shell: bash
        run: |
          set -euo pipefail
          TMP="$(mktemp -d)"
          cp -a build/lipatos-dnd5e-ru-library/. "$TMP/"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$TMP/." .
          rm -f build-report.json

          cat > README.md <<'EOF'
          # LipatoS — DND5E RU Library

          Готовый самостоятельный русскоязычный модуль D&D 5e Legacy 2014 для Foundry VTT 14 / D&D5e 6.0.5.

          Репозиторий содержит сам модуль напрямую: компендиумы, ресурсы, скрипты и module.json.
          Никаких внешних зависимостей от Laaru, исходных архивов Laaru, vendor-сборки или build-инструментов больше нет.
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Convert library to standalone module"
          git push
